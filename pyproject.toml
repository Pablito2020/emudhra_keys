[project]
name = "emudhra-keys"
version = "0.1.0"
description = "A classroom X.509 certificate signing demonstration"
readme = "README.md"
requires-python = ">=3.15,<3.16"
dependencies = ["cryptography>=50.0.2,<51"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py315"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
